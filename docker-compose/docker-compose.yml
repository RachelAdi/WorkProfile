version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: workprofile-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: workprofile_db
      MYSQL_USER: flaskapp
      MYSQL_PASSWORD: flaskapp
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: ../
    container_name: workprofile-app
    restart: always
    ports:
      - "5001:5001"   # <-- פה שמתי 5001
    environment:
      DB_HOST: mysql
      DB_USER: flaskapp
      DB_PASS: flaskapp
      DB_NAME: workprofile_db
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: workprofile-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    healthcheck:
      test: curl -f http://localhost/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  mysql-data:
