name: WorkProfile CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  APP_PORT: 5001
  NGINX_PORT: 8080
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/workprofile
  COMPOSE_DIR: docker-compose
  K8S_DIR: k8s

jobs:
  # ---------------------- Stage 1: Basic Validation ----------------------
  stage1_validation:
    runs-on: ubuntu-latest
    name: Stage 1 – Basic Validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Basic validation tests
        run: |
          python -c "import flask; print('✓ Flask import successful')"
          python -c "import mysql.connector; print('✓ MySQL connector import successful')"
          test -f Dockerfile && echo "✓ Dockerfile exists"
          test -f requirements.txt && echo "✓ requirements.txt exists"
          test -f app.py && echo "✓ app.py exists"

  # ---------------------- Stage 2: Build & Single-Container Tests ----------------------
  stage2_build_and_test:
   runs-on: ubuntu-latest
   name: Stage 2 – Build & Single-Container Tests
   needs: stage1_validation
   steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Compute version
       id: ver
       run: |
         DATE=$(date -u +%Y.%m.%d)
         SHA=${GITHUB_SHA::7}
         echo "VERSION=${DATE}.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
         echo "SHORT_SHA=${SHA}" >> $GITHUB_ENV

     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3

     - name: Build Docker image
       run: |
         docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} .
         docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
         docker images

     - name: Run container for tests
       run: |
         docker run -d --rm --name workprofile-test -p ${APP_PORT}:5000 \
           -e BACKEND=http://localhost:${APP_PORT} \
           ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
         for i in {1..30}; do
           if curl -fsS "http://localhost:${APP_PORT}/health" >/dev/null; then break; fi
           echo "Waiting for app... ($i/30)"; sleep 2
         done
         curl -f "http://localhost:${APP_PORT}/" && echo "✓ Main endpoint works"
         curl -f "http://localhost:${APP_PORT}/health" && echo "✓ Health endpoint works"
         docker stop workprofile-test


  # ---------------------- Stage 3: 3-Tier Docker Compose Tests ----------------------
  stage3_compose:
    runs-on: ubuntu-latest
    name: Stage 3 – 3-Tier Docker Compose Tests
    needs: stage2_build_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start 3-tier stack
        run: |
          cd ${COMPOSE_DIR}
          docker compose up -d
          for i in {1..60}; do
            if curl -fsS "http://localhost:${NGINX_PORT}/health" >/dev/null; then break; fi
            echo "Waiting for nginx/app/mysql... ($i/60)"; sleep 3
          done

      - name: Health check via Nginx
        run: |
          echo "Checking /health endpoint through Nginx..."
          curl -fsS "http://localhost:${NGINX_PORT}/health" || true
          curl -s "http://localhost:${NGINX_PORT}/health" | grep -i "healthy" || true
          echo "✓ Stage 3 health check completed"

      - name: Cleanup
        if: always()
        run: |
          cd ${COMPOSE_DIR}
          docker compose down -v
  # ---------------------- Stage 4: Publish Docker Image ----------------------
  stage4_publish:
    runs-on: ubuntu-latest
    name: Stage 4 – Publish
    needs: stage3_compose
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        run: |
          DATE=$(date -u +%Y.%m.%d)
          SHA=${GITHUB_SHA::7}
          echo "VERSION=${DATE}.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHA}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ---------------------- Stage 5: Kubernetes Deployment Tests ----------------------
  stage5_k8s:
    runs-on: ubuntu-latest
    name: Stage 5 – Kubernetes Deployment Tests
    needs: stage4_publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: workprofile-ci

      - name: Load image into kind
        run: |
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
          kind load docker-image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}" --name workprofile-ci || true

      - name: Apply MySQL manifests
        run: |
          kubectl apply -f ${K8S_DIR}/mysql-secret.yaml
          kubectl apply -f ${K8S_DIR}/mysql-statefulset.yaml
          kubectl apply -f ${K8S_DIR}/mysql-service.yaml
          kubectl rollout status statefulset/mysql --timeout=10m

      - name: Apply WorkProfile manifests
        run: |
          kubectl apply -f ${K8S_DIR}/workprofile-configmap.yaml
          kubectl apply -f ${K8S_DIR}/workprofile-deployment.yaml
          kubectl apply -f ${K8S_DIR}/workprofile-service.yaml
          kubectl set image deployment/workprofile workprofile-container=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          kubectl rollout status deployment/workprofile --timeout=10m

      - name: Port-forward & curl tests
        run: |
          kubectl port-forward deployment/workprofile 5001:5001 >/dev/null 2>&1 &
          PF_PID=$!
          trap "kill $PF_PID || true" EXIT
          for i in {1..40}; do
            if curl -fsS "http://localhost:5001/health" >/dev/null; then break; fi
            echo "Waiting for app on port-forward... ($i/40)"; sleep 3
          done
          curl -f http://localhost:5001/ || true
          curl -f http://localhost:5001/health || true
          curl -s http://localhost:5001/health | grep -i "healthy" || true
          echo "✓ Stage 5 Kubernetes check completed"

  # ---------------------- Stage 6: Manual Deployment Instructions ----------------------
  stage6_manual:
    runs-on: ubuntu-latest
    name: Stage 6 – Manual Deployment Instructions
    needs: stage5_k8s
    steps:
      - name: Create deployment guide
        run: |
          cat > MANUAL_DEPLOYMENT.md <<'MD'
          # WorkProfile Manual Deployment
          ## Steps
          1. Clone repo
          2. Apply K8s manifests:
             kubectl apply -f k8s/mysql-secret.yaml
             kubectl apply -f k8s/mysql-statefulset.yaml
             kubectl apply -f k8s/mysql-service.yaml
             kubectl apply -f k8s/workprofile-configmap.yaml
             kubectl apply -f k8s/workprofile-deployment.yaml
             kubectl apply -f k8s/workprofile-service.yaml
             kubectl set image deployment/workprofile workprofile-container=<image>
          3. Verify rollout and port-forward
          4. Access http://localhost:5001/health
          MD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-deployment
          path: MANUAL_DEPLOYMENT.md
