name: WorkProfile CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t workprofile:ci .

      # אם ה-App מאזין אצלך ל-5000, החליפי 5001 ל-5000 בשתי השורות הבאות
      - name: Run container
        run: docker run -d --name workprofile-ci -p 8080:5001 workprofile:ci

      - name: Wait for /health to be ready
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8080/health > /dev/null; then
              echo "App is up!"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App did not become ready" >&2
          docker logs workprofile-ci || true
          exit 1

      - name: Test root endpoint "/"
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "HTTP / => $code"
          test "$code" = "200"

      - name: Test health endpoint "/health"
        run: |
          curl -sS http://localhost:8080/health | tee health.json
          python - <<'PY'
import json, sys
with open('health.json') as f:
    data = json.load(f)
ok = (data.get('status') in ('ok','healthy')) or (data.get('database') == 'connected')
sys.exit(0 if ok else 1)
PY

      - name: Show logs on failure
        if: failure()
        run: docker logs workprofile-ci || true

      - name: Cleanup container
        if: always()
        run: docker rm -f workprofile-ci || true

  publish:
    # ירוץ רק אם ה-build-and-test הצליח, ורק ב-push ל-main
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push (latest + short SHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/workprofile:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/workprofile:${{ steps.vars.outputs.sha }}
